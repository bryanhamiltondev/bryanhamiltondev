<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 32" width="100%" height="auto">
  <defs>
    <linearGradient id="divLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="40%" stop-color="#30363d" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#30363d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="eqDot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  
  <!-- Main line -->
  <line x1="0" y1="16" x2="700" y2="16" stroke="url(#divLine)" stroke-width="1"/>
  
  <!-- Center EQ motif -->
  <g transform="translate(316, 6)">
    <rect x="0" y="6" width="6" height="14" rx="3" fill="url(#eqDot)" opacity="0.7">
      <animate attributeName="height" values="14;6;11;8;14" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="6;14;9;12;6" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="2" width="6" height="18" rx="3" fill="url(#eqDot)" opacity="0.85">
      <animate attributeName="height" values="18;8;15;11;18" dur="0.85s" repeatCount="indefinite"/>
      <animate attributeName="y" values="2;12;5;9;2" dur="0.85s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="4" width="6" height="16" rx="3" fill="url(#eqDot)" opacity="0.9">
      <animate attributeName="height" values="16;5;13;9;16" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="4;15;7;11;4" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="36" y="0" width="6" height="20" rx="3" fill="url(#eqDot)" opacity="1">
      <animate attributeName="height" values="20;7;16;12;20" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="0;13;4;8;0" dur="0.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="3" width="6" height="17" rx="3" fill="url(#eqDot)" opacity="0.9">
      <animate attributeName="height" values="17;6;14;10;17" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="y" values="3;14;6;10;3" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="5" width="6" height="15" rx="3" fill="url(#eqDot)" opacity="0.8">
      <animate attributeName="height" values="15;7;12;9;15" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="5;13;8;11;5" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
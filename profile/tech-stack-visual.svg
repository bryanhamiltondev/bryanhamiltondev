<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  
  <!-- PHP Card -->
  <rect x="10" y="10" width="140" height="80" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1"/>
  <rect x="10" y="10" width="140" height="3" rx="1.5" fill="#787CB5"/>
  <text x="80" y="48" fill="#787CB5" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">PHP</text>
  <text x="80" y="66" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">21+ Years &amp;middot; PDO &amp; Composer</text>
  
  <!-- Vanilla JS Card -->
  <rect x="170" y="10" width="140" height="80" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1"/>
  <rect x="170" y="10" width="140" height="3" rx="1.5" fill="#F7DF1E"/>
  <text x="240" y="48" fill="#F7DF1E" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Vanilla JS</text>
  <text x="240" y="66" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Zero Deps &amp;middot; Web Audio &amp; Canvas</text>
  
  <!-- MySQL Card -->
  <rect x="330" y="10" width="140" height="80" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1"/>
  <rect x="330" y="10" width="140" height="3" rx="1.5" fill="#4479A1"/>
  <text x="400" y="48" fill="#4479A1" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">MySQL</text>
  <text x="400" y="66" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">PDO &amp; Schema Design</text>
  
  <!-- SEO Card -->
  <rect x="490" y="10" width="140" height="80" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1"/>
  <rect x="490" y="10" width="140" height="3" rx="1.5" fill="#00d2ff"/>
  <text x="560" y="48" fill="#00d2ff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">SEO</text>
  <text x="560" y="66" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">JSON-LD &amp; Schema.org</text>
  
  <!-- CSS Card -->
  <rect x="650" y="10" width="140" height="80" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1"/>
  <rect x="650" y="10" width="140" height="3" rx="1.5" fill="#e6edf3"/>
  <text x="720" y="48" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">CSS</text>
  <text x="720" y="66" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Animation &amp; Responsive UX</text>

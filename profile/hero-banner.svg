<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="auto">
  <defs>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="statusGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="eqGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="-1" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b949e"/>
      <stop offset="40%" stop-color="#e6edf3"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#8b949e"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="35%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="300" fill="url(#bgGlow)" rx="12"/>
  <rect x="1" y="1" width="898" height="298" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" rx="12"/>
  
  <!-- Top accent -->
  <rect x="0" y="0" width="900" height="3" fill="#00d2ff" rx="1.5"/>
  
  <!-- Decorative circles -->
  <circle cx="820" cy="60" r="80" fill="none" stroke="#00d2ff" stroke-width="0.5" opacity="0.08"/>
  <circle cx="820" cy="60" r="120" fill="none" stroke="#00d2ff" stroke-width="0.5" opacity="0.05"/>
  <circle cx="820" cy="60" r="160" fill="none" stroke="#00d2ff" stroke-width="0.5" opacity="0.03"/>
  
  <!-- EQ Bars - main cluster -->
  <rect x="35" y="118" width="20" height="64" rx="4" fill="url(#eqGrad)" opacity="0.8">
    <animate attributeName="height" values="64;22;58;38;64" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="118;160;124;144;118" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="62" y="88" width="20" height="94" rx="4" fill="url(#eqGrad)" opacity="0.85">
    <animate attributeName="height" values="94;42;84;52;94" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="y" values="88;140;98;130;88" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  <rect x="89" y="103" width="20" height="79" rx="4" fill="url(#eqGrad)" opacity="0.9">
    <animate attributeName="height" values="79;28;68;48;79" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="103;154;114;134;103" dur="1.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="116" y="73" width="20" height="109" rx="4" fill="url(#eqGrad)" opacity="1">
    <animate attributeName="height" values="109;52;94;68;109" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="73;130;88;114;73" dur="0.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="143" y="93" width="20" height="89" rx="4" fill="url(#eqGrad)" opacity="0.95">
    <animate attributeName="height" values="89;38;74;58;89" dur="1.0s" repeatCount="indefinite"/>
    <animate attributeName="y" values="93;144;108;124;93" dur="1.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="170" y="108" width="20" height="74" rx="4" fill="url(#eqGrad)" opacity="0.85">
    <animate attributeName="height" values="74;32;62;42;74" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="108;150;120;140;108" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="197" y="83" width="20" height="99" rx="4" fill="url(#eqGrad)" opacity="0.9">
    <animate attributeName="height" values="99;48;84;58;99" dur="0.85s" repeatCount="indefinite"/>
    <animate attributeName="y" values="83;134;98;124;83" dur="0.85s" repeatCount="indefinite"/>
  </rect>
  <rect x="224" y="113" width="20" height="69" rx="4" fill="url(#eqGrad)" opacity="0.8">
    <animate attributeName="height" values="69;28;58;38;69" dur="1.15s" repeatCount="indefinite"/>
    <animate attributeName="y" values="113;154;124;144;113" dur="1.15s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Name section -->
  <text x="280" y="98" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="3.5">
    PHP &amp; VANILLA JS ENGINEER  &middot;  FOUNDER @ THE DJ CALENDAR
  </text>
  
  <text x="280" y="150" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="1" filter="url(#cyanGlow)">
    Bryan Hamilton
  </text>
  
  <text x="280" y="186" fill="url(#shimmer)" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" font-style="italic" letter-spacing="2">
    Same guy. Two ways to hire him.
  </text>
  
  <!-- Tech tags -->
  <g>
    <rect x="280" y="208" width="58" height="26" rx="4" fill="#787CB5" opacity="0.15"/>
    <text x="309" y="225" fill="#787CB5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PHP</text>
    
    <rect x="346" y="208" width="70" height="26" rx="4" fill="#F7DF1E" opacity="0.15"/>
    <text x="381" y="225" fill="#F7DF1E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Vanilla JS</text>
    
    <rect x="424" y="208" width="58" height="26" rx="4" fill="#4479A1" opacity="0.15"/>
    <text x="453" y="225" fill="#4479A1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MySQL</text>
    
    <rect x="490" y="208" width="46" height="26" rx="4" fill="#00d2ff" opacity="0.12"/>
    <text x="513" y="225" fill="#00d2ff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SEO</text>
    
    <rect x="544" y="208" width="46" height="26" rx="4" fill="#e6edf3" opacity="0.08"/>
    <text x="567" y="225" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CSS</text>
  </g>
  
  <!-- Status badge -->
  <rect x="650" y="115" width="200" height="48" rx="24" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.6"/>
  <rect x="650" y="115" width="200" height="48" rx="24" fill="#00d2ff" opacity="0.06"/>
  
  <circle cx="682" cy="139" r="6" fill="#00d2ff" filter="url(#statusGlow)">
    <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <text x="700" y="144" fill="#00d2ff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="2">
    OPEN TO WORK
  </text>
  
  <text x="660" y="182" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="1">
    Remote &middot; NJ/NY Metro
  </text>
  
  <text x="660" y="197" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="1">
    10 production-derived repos
  </text>
  
  <!-- Bottom EQ accent bar -->
  <g transform="translate(0, 270)" opacity="0.35">
    <rect x="370" y="2" width="4" height="18" rx="2" fill="#00d2ff">
      <animate attributeName="height" values="18;6;14;10;18" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="2;14;6;10;2" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="380" y="5" width="4" height="15" rx="2" fill="#00d2ff">
      <animate attributeName="height" values="15;5;12;8;15" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="5;15;8;12;5" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="390" y="0" width="4" height="20" rx="2" fill="#00d2ff">
      <animate attributeName="height" values="20;8;16;12;20" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="0;12;4;8;0" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="400" y="4" width="4" height="16" rx="2" fill="#00d2ff">
      <animate attributeName="height" values="16;4;13;7;16" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="4;16;7;13;4" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="410" y="1" width="4" height="19" rx="2" fill="#00d2ff">
      <animate attributeName="height" values="19;7;15;11;19" dur="1.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="1;13;5;9;1" dur="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="420" y="3" width="4" height="17" rx="2" fill="#00d2ff">
      <animate attributeName="height" values="17;5;14;9;17" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="3;15;6;11;3" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="430" y="0" width="4" height="20" rx="2" fill="#00d2ff">
      <animate attributeName="height" values="20;7;16;11;20" dur="0.85s" repeatCount="indefinite"/>
      <animate attributeName="y" values="0;13;4;9;0" dur="0.85s" repeatCount="indefinite"/>
    </rect>
    <rect x="440" y="4" width="4" height="16" rx="2" fill="#00d2ff">
      <animate attributeName="height" values="16;6;12;8;16" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="4;14;8;12;4" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
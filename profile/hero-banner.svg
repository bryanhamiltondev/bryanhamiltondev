<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="auto">
  <defs>
    <linearGradient id="shimmer" x1="-1" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b949e"/>
      <stop offset="40%" stop-color="#e6edf3"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#8b949e"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="35%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="300" fill="url(#bgGlow)" rx="12"/>
  <rect x="1" y="1" width="898" height="298" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" rx="12"/>
  
  <!-- Top accent -->
  <rect x="0" y="0" width="900" height="3" fill="#00d2ff" rx="1.5"/>
  
  <!-- Decorative circles -->
  <circle cx="820" cy="60" r="80" fill="none" stroke="#00d2ff" stroke-width="0.5" opacity="0.08"/>
  <circle cx="820" cy="60" r="120" fill="none" stroke="#00d2ff" stroke-width="0.5" opacity="0.05"/>
  <circle cx="820" cy="60" r="160" fill="none" stroke="#00d2ff" stroke-width="0.5" opacity="0.03"/>
  
  <!-- Subtitle -->
  <text x="80" y="98" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="3.5">
    PHP &amp; VANILLA JS ENGINEER - FOUNDER @ THE DJ CALENDAR
  </text>
  
  <!-- Name - plain white, no glow -->
  <text x="80" y="150" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="1">
    Bryan Hamilton
  </text>
  
  <!-- Tagline with shimmer -->
  <text x="80" y="186" fill="url(#shimmer)" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" font-style="italic" letter-spacing="2">
    Same guy. Two ways to hire him.
  </text>
  
  <!-- Tech tags -->
  <g>
    <rect x="80" y="208" width="58" height="26" rx="4" fill="#787CB5" opacity="0.15"/>
    <text x="109" y="225" fill="#787CB5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PHP</text>
    
    <rect x="146" y="208" width="70" height="26" rx="4" fill="#F7DF1E" opacity="0.15"/>
    <text x="181" y="225" fill="#F7DF1E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Vanilla JS</text>
    
    <rect x="224" y="208" width="58" height="26" rx="4" fill="#4479A1" opacity="0.15"/>
    <text x="253" y="225" fill="#4479A1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MySQL</text>
    
    <rect x="290" y="208" width="46" height="26" rx="4" fill="#00d2ff" opacity="0.12"/>
    <text x="313" y="225" fill="#00d2ff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SEO</text>
    
    <rect x="344" y="208" width="46" height="26" rx="4" fill="#e6edf3" opacity="0.08"/>
    <text x="367" y="225" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CSS</text>
  </g>
  
  <!-- Status badge -->
  <rect x="650" y="115" width="200" height="48" rx="24" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.6"/>
  <rect x="650" y="115" width="200" height="48" rx="24" fill="#00d2ff" opacity="0.06"/>
  
  <circle cx="682" cy="139" r="6" fill="#00d2ff">
    <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <text x="700" y="144" fill="#00d2ff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="2">
    OPEN TO WORK
  </text>
  
  <text x="660" y="182" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="1">
    Remote - NJ/NY Metro
  </text>
  
  <text x="660" y="197" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="1">
    10 production-derived repos
  </text>
</svg>